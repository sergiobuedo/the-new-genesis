name: "Multi-Seed Scientific Benchmark (N=10 Replicates, Q1 FAIR Data)"

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of independent paired random seeds (Live vs. Null)"
        required: false
        default: "10"
      days:
        description: "Planetary days simulated per replicate"
        required: false
        default: "730"
      founders_per_lineage:
        description: "Initial adult founders per lineage (7 = 21 total Allee arm, 15 = 45 total Dunbar band)"
        required: false
        default: "7"
      model_tag:
        description: "Model or ablation arm label (e.g. v3_dunbar45, abm_v3_baseline, qwen2.5-1.5b)"
        required: false
        default: "abm_v3_baseline"

permissions:
  contents: write

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen protocol codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install scientific dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify Epistemic Veil & Scientific Integrity Suite (13/13)
        run: python -m pytest tests/ -v

      - name: Run N Paired Independent Replicates (Live vs. Null-Control Twin)
        run: python -m backend.academia.multi_seed_benchmark --seeds "${{ github.event.inputs.seeds || '20' }}" --days "${{ github.event.inputs.days || '730' }}" --founders-per-lineage "${{ github.event.inputs.founders_per_lineage || '7' }}" --model-tag "${{ github.event.inputs.model_tag || 'abm_v3_baseline' }}"

      - name: Publish FAIR CSV & Summary JSON to live-telemetry branch
        run: |
          mkdir -p /tmp/bench_out
          cp chronicles/benchmark_results.csv chronicles/benchmark_summary.json /tmp/bench_out/
          git config user.name "Dr. Sergio Buedo Martínez (Observatory Daemon)"
          git config user.email "observatory@agobac-ia.es"
          git fetch origin live-telemetry:live-telemetry
          git checkout -f live-telemetry
          mkdir -p chronicles
          # Preserve previous v3.0 21-founder Allee arm if not yet archived
          if [ -f chronicles/benchmark_results.csv ] && [ ! -f chronicles/benchmark_results_v3_allee21.csv ]; then
            cp chronicles/benchmark_results.csv chronicles/benchmark_results_v3_allee21.csv
            cp chronicles/benchmark_summary.json chronicles/benchmark_summary_v3_allee21.json || true
          fi
          TAG="${{ github.event.inputs.model_tag || 'abm_v3_baseline' }}"
          cp /tmp/bench_out/benchmark_results.csv chronicles/benchmark_results.csv
          cp /tmp/bench_out/benchmark_summary.json chronicles/benchmark_summary.json
          cp /tmp/bench_out/benchmark_results.csv "chronicles/benchmark_results_${TAG}.csv"
          cp /tmp/bench_out/benchmark_summary.json "chronicles/benchmark_summary_${TAG}.json"
          git checkout main -- PROTOCOL.md || true
          git add -f chronicles/benchmark_results*.csv chronicles/benchmark_summary*.json PROTOCOL.md
          git commit -m "science(benchmark): publish N=${{ github.event.inputs.seeds || '20' }} paired multi-seed FAIR dataset (v3.0-protocol, ${TAG})" || true
          git push origin live-telemetry
